name: Preview (this fork)

# A fork gets no Pages site of its own, and the repository's own workflows need rights a fork does
# not receive on a pull request. This workflow therefore builds both languages and pushes them to
# the `preview` branch, which GitHub Pages serves as the site root, the same way the upstream
# repository uses its gh-pages branch. /de/ is the German build, the root is English.

on:
  push:
    branches: [de-translation-keep]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build English under /
        run: env APP_CHANNEL=next npm run build -- --base=/sail-learn-and-train/ --outDir=dist-preview
      - name: Build German under /de/
        run: env APP_CHANNEL=next npm run build -- --base=/sail-learn-and-train/de/ --outDir=dist-preview-de
      - name: Move the German build into de/
        run: |
          mkdir -p dist-preview/de
          cp -r dist-preview-de/. dist-preview/de/
          touch dist-preview/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: preview
          folder: dist-preview
          clean: true
          force: false
